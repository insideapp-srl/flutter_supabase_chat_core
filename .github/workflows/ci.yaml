name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze and unit tests (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version declared in pubspec.yaml, and the latest stable.
        flutter: ['3.35.0', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Formatting output can differ between Dart versions: checked on the
      # latest stable only.
      - name: Check formatting
        if: matrix.flutter == 'stable'
        run: dart format . --set-exit-if-changed

      - name: Analyze
        run: flutter analyze --no-pub

      # The integration tests (tag `integration`) need the Supabase stack:
      # see the integration job.
      - name: Unit tests
        run: flutter test --no-pub --exclude-tags integration --coverage

      # pana converts the pubspec screenshots with cwebp/gif2webp, as pub.dev
      # does: without them the example/screenshots check fails.
      - name: pub.dev score (pana)
        if: matrix.flutter == 'stable'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp
          dart pub global activate pana
          pana --no-warning --exit-code-threshold 0 .

  integration:
    name: Database and integration tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Install dependencies
        run: flutter pub get

      - name: Start the local Supabase stack
        run: supabase start

      # Applies example/utils/sql exactly as end users do.
      - name: Apply the chat schema
        run: bash tool/local_db.sh

      - name: Database tests (pgTAP)
        run: supabase test db

      - name: Integration tests
        run: bash tool/test_integration.sh --no-reset

      - name: Stop the local Supabase stack
        if: always()
        run: supabase stop --no-backup

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: doc/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: doc

      # onBrokenLinks: 'throw' fails the build on a broken link.
      - name: Build
        run: npm run build
        working-directory: doc
