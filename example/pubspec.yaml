name: example
description: >
  Example app for flutter_supabase_chat_core: direct and group chats,
  attachments, voice messages, reactions, read receipts, typing indicators
  and online status on Supabase, with the Flyer Chat UI.
publish_to: 'none'

version: 2.0.0

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  audioplayers: ^6.8.1
  cupertino_icons: ^2.0.0
  faker: ^2.2.0
  file_picker: ^13.1.0
  file_saver: ^0.7.0
  flutter:
    sdk: flutter
  flutter_chat_core: ^2.9.0
  # 2.12.0 (released 2026-09-12) swapped Composer's TextField to an
  # experimental `material_ui` package with its own Material widget, which
  # doesn't satisfy a standard Scaffold's Material ancestor -- crashes with
  # "No Material widget found." Pinned below it until that's sorted out
  # upstream.
  flutter_chat_ui: '>=2.11.1 <2.12.0'
  flutter_supabase_chat_core:
    path: ../
  flyer_chat_file_message: ^2.4.0
  flyer_chat_image_message: ^2.3.0
  flyer_chat_text_message: ^2.6.0
  http: ^1.4.0
  image_picker: ^1.1.2
  open_filex: ^5.0.0
  path_provider: ^2.1.5
  # Reads the callbacks `Chat` provides to its composer (see ChatComposer).
  provider: ^6.1.5
  record: ^7.1.1
  supabase_flutter: ^2.9.1
  uuid: ^4.5.1


dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/