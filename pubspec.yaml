name: flutter_supabase_chat_core
description: >
  Actively maintained, community-driven Supabase BaaS for chat applications
  with an optional chat UI.
version: 2.0.0-rc.3
homepage: https://flutter-supabase-chat-core.insideapp.it
repository: https://github.com/insideapp-srl/flutter_supabase_chat_core
issue_tracker: https://github.com/insideapp-srl/flutter_supabase_chat_core/issues
topics:
  - chat
  - supabase
  - realtime
  - messaging
  - flutter-chat-ui

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_chat_core: ^2.9.0
  meta: ^1.16.0
  mime: '>=1.0.2 <3.0.0'
  supabase_flutter: ^2.17.2
  uuid: ^4.5.1
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

screenshots:
  - description: 'Example app: Telegram-style chat with replies, reactions and voice messages'
    path: doc/static/img/example_light.jpg